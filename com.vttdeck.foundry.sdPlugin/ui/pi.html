<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>VTT Deck</title>
	<link rel="stylesheet" href="pi.css" />
</head>
<body>
	<div id="status" class="status off"><span class="dot"></span><span class="txt" data-t="Connexion au plugin…">Connecting to the plugin…</span></div>
	<p id="help" class="help"></p>
	<form id="form" onsubmit="return false"></form>

	<details id="connection">
		<summary data-t="Connexion Foundry">Foundry connection</summary>
		<div class="row">
			<label for="port">Port</label>
			<input id="port" type="number" min="1024" max="65535" value="3006" />
		</div>
		<div class="row">
			<label for="allowRemote" data-t="Réseau">Network</label>
			<span class="check"><input id="allowRemote" type="checkbox" /> <span data-t="accepter les connexions d'autres machines">accept connections from other computers</span></span>
		</div>
		<div class="row">
			<label></label>
			<button id="applyConn" type="button" data-t="Appliquer">Apply</button>
		</div>
		<p class="help small" data-t="Le port doit être identique à celui réglé dans Foundry (Paramètres du module « VTT Deck »). Le réglage s'applique à tout le plugin.">The port must match the one set in Foundry ("VTT Deck" module settings). This setting applies to the whole plugin.</p>
	</details>

	<script src="pi.js"></script>
</body>
</html>
